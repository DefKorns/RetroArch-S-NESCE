# runs on the staged files before each commit; set up with "pre-commit install" (see README → Contributing)
# only the hmod packaging is checked: the rest of the tree is RetroArch itself
files: ^(hmod/|Makefile\.hmod$|\.github/workflows/hmod\.yml$|\.pre-commit-config\.yaml$|\.shellcheckrc$|\.markdownlint\.yaml$)
exclude: ^(LICENSE|.*OFL.*.txt|vendor/|hmod/tests/golden/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        # VS Code settings are JSON with comments
        exclude: ^\.vscode/
      - id: check-merge-conflict
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=style]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
