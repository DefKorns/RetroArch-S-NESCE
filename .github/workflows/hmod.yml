name: hmod

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Makefile.hmod
      - classicmini/**
      - .github/workflows/hmod.yml
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: sh classicmini/tests/docker-run.sh

  hmod:
    needs: tests
    # Keep in sync with the vendor/hmod-build submodule tag.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@v1.8.1
    with:
      release-name: RetroArch (S)NESCE
      make: -f Makefile.hmod hmod
      docker: true
    secrets: inherit
    permissions:
      contents: write
